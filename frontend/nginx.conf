server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El cliente y la API comparten origen, asi que el navegador no necesita CORS
    # y la consola funciona igual servida desde cualquier host.
    location /api/ {
        proxy_pass http://query-engine:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;   # una carga masiva puede tardar minutos
        proxy_send_timeout 600s;
        client_max_body_size 64m;
    }

    location /health {
        proxy_pass http://query-engine:8001/health;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
    }
}
